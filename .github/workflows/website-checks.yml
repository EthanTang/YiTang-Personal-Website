name: Website checks
on:
  pull_request:
  push:
    branches: [main, website-redesign]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node site/test.mjs
      - run: node site/build.mjs
